<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + TS</title>
    <style>
      body { margin: 0; overflow: hidden; background-color: #333; }
      canvas { display: block; }
      #mainMenu {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0,0,0,0.8);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        text-align: center;
        z-index: 10; /* Ensure menu is on top */
      }
      #mainMenu input {
        padding: 10px;
        margin: 10px;
        border-radius: 5px;
        border: none;
        width: 200px;
      }
      #mainMenu button {
        padding: 10px 20px;
        margin-top: 10px;
        border-radius: 5px;
        border: none;
        background-color: #4CAF50;
        color: white;
        cursor: pointer;
        font-size: 16px;
      }
      #mainMenu button:hover {
        background-color: #45a049;
      }
      #gameOverScreen {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: none;
        text-align: center;
        background-color: rgba(0,0,0,0.7);
        color: white;
        padding: 20px;
        border-radius: 10px;
      }
      #leaderboard {
        position: absolute;
        top: 10px;
        right: 10px;
        background-color: rgba(0,0,0,0.5);
        color: white;
        padding: 10px;
        border-radius: 5px;
        min-width: 200px; /* Increased width for names */
        z-index: 5; /* Below menu, above canvas if needed */
        display: none; /* Initially hidden */
      }
      #leaderboard h3 {
        margin-top: 0;
      }
      #leaderboard ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      #leaderboard li {
        margin-bottom: 5px;
      }
    </style>
  </head>
  <body>
    <div id="mainMenu">
      <h1>Agar.io Clone</h1>
      <input type="text" id="playerNameInput" placeholder="Enter your name">
      <button id="playButton">Play</button>
    </div>
    <canvas id="gameCanvas" style="display: none;"></canvas> <!-- Initially hidden -->
    <div id="gameOverScreen">
      <h2>Game Over</h2>
      <p id="gameOverMessage"></p>
      <button id="playAgainButton">Play Again</button>
      <button id="backToMenuButton">Back to Menu</button> <!-- Added -->
    </div>
    <div id="leaderboard">
      <h3>Leaderboard</h3>
      <ul id="leaderboardList"></ul>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
